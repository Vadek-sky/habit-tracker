<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дисциплина / Трекер привычек</title>
<style>
  :root{
    --bg: #14171a;
    --bg-raised: #1c2024;
    --line: #2a2f34;
    --text: #ece9e2;
    --text-dim: #8a9096;
    --gold: #c9a227;
    --teal: #4d7d6f;
    --red: #8b4049;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
    padding: 24px 16px 60px;
  }
  .wrap{ max-width: 560px; margin: 0 auto; }

  header{ margin-bottom: 28px; }
  .eyebrow{
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 6px;
  }
  h1{
    font-family: Georgia, "Times New Roman", serif;
    font-size: 28px;
    font-weight: 400;
    letter-spacing: -0.01em;
  }
  .sub{ color: var(--text-dim); font-size: 13px; margin-top: 6px; }

  .streak-row{
    display:flex;
    gap: 10px;
    margin: 22px 0 26px;
  }
  .streak-card{
    flex:1;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .streak-num{
    font-family: ui-monospace, monospace;
    font-size: 26px;
    color: var(--gold);
  }
  .streak-label{ font-size: 11px; color: var(--text-dim); margin-top: 2px; }

  .date-nav{
    display:flex;
    align-items:center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .date-nav button{
    background: var(--bg-raised);
    border: 1px solid var(--line);
    color: var(--text);
    width: 32px; height: 32px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
  }
  .date-nav button:hover{ border-color: var(--gold); }
  .date-label{
    font-family: ui-monospace, monospace;
    font-size: 13px;
    color: var(--text-dim);
  }
  .date-label.today{ color: var(--gold); }

  .habit{
    display:flex;
    align-items:flex-start;
    gap: 12px;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .habit:hover{ border-color: #3a4046; }
  .habit.done{ border-color: var(--teal); background: #1a2422; }

  .box{
    flex-shrink:0;
    width: 22px; height: 22px;
    border-radius: 6px;
    border: 1.5px solid var(--text-dim);
    margin-top: 1px;
    display:flex; align-items:center; justify-content:center;
    font-size: 13px;
    transition: all 0.15s;
  }
  .habit.done .box{
    background: var(--teal);
    border-color: var(--teal);
  }

  .habit-text .name{ font-size: 14.5px; }
  .habit-text .why{ font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .habit.done .name{ color: #cfe3dc; }

  .week{
    margin-top: 30px;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
  }
  .week-title{
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    margin-bottom: 12px;
  }
  .week-grid{
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }
  .day-cell{
    aspect-ratio: 1;
    border-radius: 6px;
    background: #23272b;
    display:flex; align-items:center; justify-content:center;
    font-family: ui-monospace, monospace;
    font-size: 10px;
    color: var(--text-dim);
    border: 1px solid transparent;
  }
  .day-cell.full{ background: var(--teal); color: #dff; }
  .day-cell.partial{ background: #3a4a2f; color: var(--text); }
  .day-cell.selected{ border-color: var(--gold); }

  .reset{
    margin-top: 24px;
    text-align:center;
  }
  .reset button{
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 12px;
    text-decoration: underline;
    cursor: pointer;
  }
  .loading{ text-align:center; color: var(--text-dim); padding: 40px; font-size:13px; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading">Загрузка…</div>
</div>

<script>
const HABITS = [
  { id: 'no_phone_morning', name: 'Первые 30 минут без телефона', why: 'задаёт тон дню' },
  { id: 'real_rest_after_session', name: 'После сессии — телефон в другую комнату на 20-30 мин', why: 'настоящий отдых, не смена стимуляции' },
  { id: 'no_social_before_noon', name: 'Без соцсетей/YouTube до обеда', why: 'снижает импульсивный скролл' },
  { id: 'no_reels_after_series', name: 'После сериала — сразу отбой, без рилсов/соцсетей', why: 'рилсы сдвигают засыпание сильнее всего' },
  { id: 'gto_drill', name: 'Хотя бы 1 дрилл в GTO Wizard', why: 'правило 2 минут' },
  { id: 'test_habit', name: 'Тестовая привычка', why: 'проверка что всё работает' },
];

let state = { records: {}, selectedDate: todayStr() };

function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function addDays(dateStr, n){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function fmtLabel(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'short' });
}

function loadAll(){
  try{
    const raw = localStorage.getItem('habit_records');
    state.records = raw ? JSON.parse(raw) : {};
  }catch(e){
    state.records = {};
  }
  render();
}

let saveStatus = 'idle'; // idle | error

function saveRecords(){
  try{
    localStorage.setItem('habit_records', JSON.stringify(state.records));
    saveStatus = 'idle';
  }catch(e){
    console.error('save failed', e);
    saveStatus = 'error';
  }
  renderStatus();
}

function renderStatus(){
  const el = document.getElementById('save-status');
  if(!el) return;
  if(saveStatus === 'saving'){
    el.textContent = 'Сохраняю…';
    el.style.color = 'var(--text-dim)';
  } else if(saveStatus === 'error'){
    el.textContent = 'Не сохранилось — нажми, чтобы повторить';
    el.style.color = 'var(--red)';
    el.style.cursor = 'pointer';
    el.onclick = () => saveRecords();
  } else {
    el.textContent = '';
  }
}

function toggleHabit(dateStr, habitId){
  if(!state.records[dateStr]) state.records[dateStr] = {};
  state.records[dateStr][habitId] = !state.records[dateStr][habitId];
  saveRecords();
  render();
}

function dayCompletion(dateStr){
  const rec = state.records[dateStr] || {};
  const done = HABITS.filter(h => rec[h.id]).length;
  return done;
}

function computeStreak(){
  let streak = 0;
  let cursor = todayStr();
  // if today has zero progress, start counting from yesterday for "current streak"
  while(true){
    const done = dayCompletion(cursor);
    if(done >= Math.ceil(HABITS.length * 0.6)){ // 60%+ counts as a "won" day
      streak++;
      cursor = addDays(cursor, -1);
    } else {
      if(cursor === todayStr()){ cursor = addDays(cursor, -1); continue; }
      break;
    }
  }
  return streak;
}

function bestStreak(){
  // simple approximation: scan last 90 days
  let best = 0, cur = 0;
  let cursor = addDays(todayStr(), -89);
  for(let i=0;i<90;i++){
    const done = dayCompletion(cursor);
    if(done >= Math.ceil(HABITS.length * 0.6)){ cur++; best = Math.max(best,cur); }
    else cur = 0;
    cursor = addDays(cursor, 1);
  }
  return best;
}

function render(){
  const app = document.getElementById('app');
  const sel = state.selectedDate;
  const rec = state.records[sel] || {};
  const isToday = sel === todayStr();
  const streak = computeStreak();
  const best = bestStreak();

  let html = '';
  html += '<header>';
  html += '<div class="eyebrow">Трекер дисциплины</div>';
  html += '<h1>Меньше телефона, больше сделано</h1>';
  html += '<div class="sub">5 привычек в день — отмечай честно</div>';
  html += '</header>';

  html += '<div class="streak-row">';
  html += `<div class="streak-card"><div class="streak-num">${streak}</div><div class="streak-label">Текущая серия</div></div>`;
  html += `<div class="streak-card"><div class="streak-num">${best}</div><div class="streak-label">Лучшая серия</div></div>`;
  html += '</div>';

  html += '<div class="date-nav">';
  html += `<button onclick="navDate(-1)">‹</button>`;
  html += `<div class="date-label ${isToday ? 'today' : ''}">${isToday ? 'Сегодня · ' : ''}${fmtLabel(sel)}</div>`;
  html += `<button onclick="navDate(1)" ${sel >= todayStr() ? 'disabled style="opacity:0.3;cursor:default;"' : ''}>›</button>`;
  html += '</div>';

  HABITS.forEach(h => {
    const done = !!rec[h.id];
    html += `<div class="habit ${done ? 'done' : ''}" onclick="toggleHabit('${sel}','${h.id}')">`;
    html += `<div class="box">${done ? '✓' : ''}</div>`;
    html += `<div class="habit-text"><div class="name">${h.name}</div><div class="why">${h.why}</div></div>`;
    html += '</div>';
  });

  // week grid: last 7 days ending today
  html += '<div class="week"><div class="week-title">Последние 7 дней</div><div class="week-grid">';
  for(let i=6;i>=0;i--){
    const d = addDays(todayStr(), -i);
    const done = dayCompletion(d);
    const cls = done === HABITS.length ? 'full' : (done > 0 ? 'partial' : '');
    const selCls = d === sel ? 'selected' : '';
    const dayNum = new Date(d+'T00:00:00').getDate();
    html += `<div class="day-cell ${cls} ${selCls}" onclick="selectDate('${d}')">${dayNum}</div>`;
  }
  html += '</div></div>';

  html += '<div class="reset"><button onclick="resetToday()">Сбросить этот день</button></div>';
  html += '<div id="save-status" style="text-align:center; font-size:11px; margin-top:10px; min-height:14px;"></div>';

  app.innerHTML = html;
  renderStatus();
}

function navDate(delta){
  const next = addDays(state.selectedDate, delta);
  if(next > todayStr()) return;
  state.selectedDate = next;
  render();
}
function selectDate(d){
  state.selectedDate = d;
  render();
}
function resetToday(){
  delete state.records[state.selectedDate];
  saveRecords();
  render();
}

window.toggleHabit = toggleHabit;
window.navDate = navDate;
window.selectDate = selectDate;
window.resetToday = resetToday;

loadAll();
</script>
</body>
</html>
